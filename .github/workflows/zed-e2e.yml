name: zed e2e (two-source Node consumer)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZED_CLI_REF: 7e5ac1897a872223f8316ef1c3342a2fa1982504
  ZED_INTERFACES_REF: 6e893ad0f28ccfbb7722f007d75e88548f1bcfdf
  POLYGLOT_REF: 998964aa58e49595547650b4a8da407b7a2283a9
  SHARED_SCHEMA_REF: 41cec5076791555d4b72e72da0a42888da0522d0

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: app
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: zed-pkg/zed-cli
          ref: ${{ env.ZED_CLI_REF }}
          path: zed-cli
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: zed-pkg/zed-interfaces
          ref: ${{ env.ZED_INTERFACES_REF }}
          path: zed-interfaces
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: zed-pkg-test/polyglot-lib
          ref: ${{ env.POLYGLOT_REF }}
          path: polyglot-lib
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: zed-pkg-test/shared-schema
          ref: ${{ env.SHARED_SCHEMA_REF }}
          path: shared-schema
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Build exact Zed CLI
        run: cargo build --locked --release --bin zed --manifest-path zed-cli/Cargo.toml
      - name: Configure hermetic registry
        run: |
          {
            echo "ZED=$GITHUB_WORKSPACE/zed-cli/target/release/zed"
            echo "ZED_PKG_REGISTRY=file://$RUNNER_TEMP/zed-reg"
            echo "ZED_PKG_HOME=$RUNNER_TEMP/zed-home"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/zed-reg" "$RUNNER_TEMP/zed-home"
      - name: Publish both source repositories
        run: |
          set -euo pipefail
          (cd polyglot-lib && "$ZED" publish --skip-vcs-checks)
          (cd shared-schema && "$ZED" publish --skip-vcs-checks)
          test "$(find "$RUNNER_TEMP/zed-reg" -name '*.tar.gz' | wc -l)" -eq 5
      - name: Install npm dependencies and both Zed packages
        working-directory: app
        run: |
          npm install
          "$ZED" install --install-mode copy
      - name: Execute Node slice and validate shared schema
        working-directory: app
        run: |
          set -euo pipefail
          NODE_PATH="$(cat .zed/node_path)" npm start
          installed=.vendor/.zed/zedtest/polyglot-lib-nodejs
          schema=.vendor/.zed/zedtest/shared-schema/schemas/job-envelope.schema.json
          test -f "$installed/index.js"
          test -f "$schema"
          for stray in client.go pyproject.toml Cargo.toml; do
            test ! -e "$installed/$stray"
          done
          node <<'NODE'
          const fs = require('node:fs');
          const schema = JSON.parse(fs.readFileSync('.vendor/.zed/zedtest/shared-schema/schemas/job-envelope.schema.json'));
          if (schema.title !== 'JobEnvelope') throw new Error('wrong shared schema');
          const idx = require('./.zed/paths.json');
          for (const name of ['zedtest/polyglot-lib-nodejs', 'zedtest/shared-schema']) {
            if (!idx.packages.some((p) => p.package === name)) throw new Error(`missing ${name}`);
          }
          NODE
      - name: Refuse a different language without explicit override
        working-directory: app
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/wrong-language"
          mkdir -p "$scratch"
          cp package.json "$scratch/"
          sed 's/polyglot-lib-nodejs/polyglot-lib-golang/' .zpkg.toml > "$scratch/.zpkg.toml"
          cd "$scratch"
          if "$ZED" install > out.log 2>&1; then
            echo '::error::a gomod package installed into an npm project' >&2
            exit 1
          fi
          grep -q 'gomod' out.log
          grep -q 'npm' out.log
          grep -q 'zedtest/polyglot-lib-nodejs' out.log
          "$ZED" install --allow-ecosystem-mismatch --install-mode copy
